<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battaglia Navale</title>
    <link rel="icon" type="image/x-icon">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="scelta">
        <label for="sizes">Scegli la dimensione della griglia!</label><br>
        <select id="sizes">
            <option value="6">6x6</option>
            <option value="7">7x7</option>
            <option value="8">8x8</option>
        </select>
    </div>

    <div id="container">    
        <button id="play" onclick="play()">Gioca!</button>
    </div>

    <div>
        <h3 id="turno"></h3>
    </div>

    <div id="gridCont">
        <div id="grid">

        </div>
    </div>

    <div id="timerCont">
        <h2>
            <span id="min">00</span>:<span  id="sec">00</span>
        </h2>
        
        <h2>
            Tentativi:  <span id="tent">0</span>
        </h2>
    </div>
</body>

</html>
